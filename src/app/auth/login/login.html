<form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
  <div class="example-container">
    <mat-form-field>
      <mat-label>Correo</mat-label>
      <input matInput placeholder="admin@example.com" formControlName="email" (blur)="updateErrorMessage()" required />
      @if (email?.invalid) {
      <mat-error>{{ errorMessage() }}</mat-error>
      }
    </mat-form-field>

    <mat-form-field>
      <mat-label>Enter your password</mat-label>
      <input matInput [type]="hide() ? 'password' : 'text'" formControlName="password" />
      <button matIconButton matSuffix (click)="clickEvent($event)" [attr.aria-label]="'Hide password'"
        [attr.aria-pressed]="hide()">
        <mat-icon>{{hide() ? 'visibility_off' : 'visibility'}}</mat-icon>
      </button>
    </mat-form-field>
    <button matButton="elevated">Iniciar Sesion </button>
  </div>
</form>
